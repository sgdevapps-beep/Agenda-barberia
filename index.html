/* Layout: una hoja de cuaderno. Cabecera fija con el día y el total; debajo, una línea por media hora. Tocar una línea vacía = apuntar ahí mismo. */
:root{
  --bg:#f3f5f7; --paper:#ffffff; --ink:#16202a; --muted:#5f6b78; --faint:#9aa5b1; --line:#e2e6eb;
  --accent:#1d4f91; --accent-ink:#ffffff; --accent-soft:#e8eff9;
  --ok:#1f7a4d; --warn:#a8620a; --danger:#c0392b; --block-a:#f8d2cc; --block-b:#f0b4ab; --block-ink:#b42318; --pole-red:#c9362c; --pole-white:#ffffff;
  --font-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f151b; --paper:#18212a; --ink:#e8edf2; --muted:#9aa7b4; --faint:#66737f; --line:#26313c;
    --accent:#7fb0ee; --accent-ink:#0c1620; --accent-soft:#1c2c3f;
    --ok:#5cc491; --warn:#e2a04a; --danger:#ec6b5e; --block-a:#3a1e1c; --block-b:#4b2522; --block-ink:#ff8a7d; --pole-red:#e0564c; --pole-white:#e8edf2;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f151b; --paper:#18212a; --ink:#e8edf2; --muted:#9aa7b4; --faint:#66737f; --line:#26313c;
  --accent:#7fb0ee; --accent-ink:#0c1620; --accent-soft:#1c2c3f;
  --ok:#5cc491; --warn:#e2a04a; --danger:#ec6b5e; --block-a:#3a1e1c; --block-b:#4b2522; --block-ink:#ff8a7d; --pole-red:#e0564c; --pole-white:#e8edf2;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.pole{height:4px;background:repeating-linear-gradient(135deg,var(--pole-red) 0 12px,var(--pole-white) 12px 24px,var(--accent) 24px 36px,var(--pole-white) 36px 48px)}
.app{max-width:560px;margin:0 auto}

/* Cabecera */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.dnav{display:flex;align-items:center;gap:2px}
.arrow,.icon{flex:none;width:36px;height:40px;border:0;background:transparent;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:24px;line-height:1}
.icon{color:var(--muted)}
.arrow:hover,.icon:hover{background:var(--line)}
.dpick{position:relative;flex:1;min-width:0;padding:0 4px}
.dpick small{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.dpick h1{font-family:var(--font-display);font-size:clamp(18px,5.2vw,22px);line-height:1.15;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbtn{display:block;width:100%;border:0;background:transparent;text-align:left;padding:2px 6px;border-radius:10px;color:inherit}
.dbtn:hover{background:var(--line)}
.dbtn .chev{color:var(--accent);font-weight:700}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead h2{text-align:center;flex:1}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calgrid .wd{text-align:center;font-size:12px;font-weight:700;color:var(--faint);padding:4px 0}
.cd{position:relative;height:46px;border:0;border-radius:12px;background:transparent;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.cd:hover{background:var(--bg)}
.cd.off{color:var(--faint);font-weight:500;opacity:.6}
.cd.past{color:var(--muted);font-weight:500}
.cd.today{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
.cd.sel{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.cd i{position:absolute;left:50%;bottom:6px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.cd.sel i{background:var(--accent-ink)}
.calnote{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.calnote span{display:inline-flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
.sub{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:15px;padding:0 4px;min-height:24px}
.sub b{color:var(--ink);font-variant-numeric:tabular-nums}
.tlink{border:0;background:none;color:var(--accent);font-weight:700;padding:2px 0;font-size:15px}
.tabs{display:flex;gap:3px;background:var(--line);padding:3px;border-radius:12px;overflow-x:auto}
.tab{flex:1 0 auto;border:0;background:transparent;border-radius:9px;padding:7px 12px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab.sel{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.tab small{margin-left:5px;color:var(--faint);font-variant-numeric:tabular-nums}

/* Hoja */
.page{background:var(--paper)}
@media (min-width:600px){.page{border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;overflow:hidden}}
.ln{display:grid;grid-template-columns:62px 1fr;width:100%;min-height:52px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:0;text-align:left;font:inherit;color:inherit}
.ln .t{padding:15px 0 0 16px;font-size:14px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.ln .c{display:flex;align-items:flex-start;gap:10px;padding:8px 16px 8px 4px;min-width:0}
.ln.free:hover{background:var(--accent-soft)}
.ln.free:hover .c::after{content:"Apuntar aquí";color:var(--accent);font-size:14px;font-weight:600;padding-top:7px}
.ln.appt .t{color:var(--ink)}
.ln.appt:hover{background:var(--bg)}
.who{flex:1;min-width:0;display:flex;flex-direction:column;padding-top:4px}
.name{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.svc{color:var(--muted);font-size:14px}
.mark{font-size:13px;font-weight:700;white-space:nowrap;padding-top:7px}
.mark.done{color:var(--ok)}
.mark.noshow{color:var(--warn)}
.ln.noshow .name{text-decoration:line-through;color:var(--muted)}
.gap{padding:5px 16px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);background:var(--bg);border-bottom:1px solid var(--line)}
.ln.edit{background:var(--accent-soft)}
.quick{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.qrow{display:flex;gap:8px}
.qrow input{flex:1;min-width:0;border:1.5px solid var(--accent);border-radius:10px;padding:9px 12px;background:var(--paper);font-size:17px}
.okbtn{flex:none;border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:0 16px;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;align-items:center}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--ink)}
.chip small{color:var(--muted);font-weight:500;margin-left:4px}
.chip.sel{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.sel small{color:var(--paper);opacity:.75}
.x-link{flex:none;border:0;background:none;color:var(--muted);font-size:14px;font-weight:600;padding:6px 4px;text-decoration:underline}
.err{color:var(--danger);font-size:14px;font-weight:600}
.empty{padding:40px 24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 0;text-decoration:underline}
.foot{margin:0;padding:14px 16px 40px;text-align:center;color:var(--faint);font-size:13px;min-height:20px}

/* Hojas emergentes */
.scrim{position:fixed;inset:0;background:rgba(8,14,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 16px 24px;display:flex;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto}
.sheet h2{font-family:var(--font-display);font-size:22px;margin:0}
.sheet p{margin:0;color:var(--muted)}
.sheet form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;font-weight:700;color:var(--muted)}
.in{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{flex:1 1 120px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.on-ok{border-color:var(--ok);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.btn.on-warn{border-color:var(--warn);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.del{border:0;background:none;color:var(--danger);font-weight:700;padding:6px 0;align-self:flex-start}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:st}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;counter-increment:st}
.steps li::before{content:counter(st);width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center}
.steps b{display:block}
.steps span{color:var(--muted);font-size:15px}
.check{display:flex;align-items:center;gap:10px}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}

/* Ajustes */
.set{padding:16px 12px 24px;display:flex;flex-direction:column;gap:22px}
.set h2{font-size:13px;font-weight:700;color:var(--muted);margin:0 4px 8px;text-transform:uppercase;letter-spacing:.05em}
.box{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.box>*{border-bottom:1px solid var(--line)}
.box>*:last-child{border-bottom:0}
.pad{padding:10px 12px}
.srow{display:grid;grid-template-columns:1fr 88px 72px 36px;gap:6px;padding:8px 8px 8px 12px;align-items:center}
.srow .in{padding:9px 10px}
.xbtn{width:36px;height:36px;border:0;background:transparent;color:var(--faint);font-size:22px;border-radius:8px;line-height:1}
.xbtn:hover{background:var(--bg);color:var(--danger)}
.addbtn{width:100%;border:0;background:transparent;padding:12px;color:var(--accent);font-weight:700;text-align:left}
.brow{display:flex;gap:8px;align-items:center;padding:8px 12px}
.brow .in{flex:1}
.hrow{display:grid;grid-template-columns:118px 1fr;gap:8px;padding:8px 12px;align-items:center;min-height:52px}
.hrow .check{font-weight:600}
.times{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;color:var(--muted);font-size:14px}
.times input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 6px;width:92px;font-variant-numeric:tabular-nums}
.small-link{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;padding:4px 2px}
.closedtxt{color:var(--faint)}
.warnbox{padding:10px 12px;color:var(--danger);font-size:14px;font-weight:600;background:var(--bg)}
.savebar{position:sticky;bottom:0;display:flex;gap:8px;padding:12px;background:var(--bg);border-top:1px solid var(--line)}
.sug{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px}
.sug b{font-weight:700}
.sug small{color:var(--muted);font-size:13px}
.sug:hover{border-color:var(--accent)}
.suggs{display:flex;flex-direction:column;gap:6px}
.suggs:empty{display:none}
.qlinks{display:flex;justify-content:space-between;gap:8px;align-items:center}
.qsel{border:1.5px solid var(--accent);border-radius:10px;padding:9px 10px;background:var(--paper)}
.ln.block{background:repeating-linear-gradient(135deg,var(--block-a) 0 10px,var(--block-b) 10px 20px);box-shadow:inset 5px 0 0 var(--block-ink)}
.ln.block .t,.ln.block .name{color:var(--block-ink)}
.ln.block .name{font-size:16px}
.ln.block .svc{color:var(--ink)}
.ln.block:hover{filter:brightness(.97)}
.okbtn.red{background:var(--block-ink);color:#fff}
.pagefoot{padding:14px 16px;display:flex;justify-content:center}
.totals{border:0;background:none;padding:2px 0;color:var(--muted);font-size:15px;text-align:left}
.totals .chev{color:var(--accent);font-weight:700;margin-left:2px}
.totals:hover{color:var(--ink)}
.addwalk{border:1px solid var(--accent);background:var(--paper);color:var(--accent);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.memo{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--muted)}
.memo b{color:var(--ink)}
.btn.wa{display:block;text-align:center;text-decoration:none;color:var(--ok);border-color:var(--ok)}
.hint{font-size:14px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile span{font-size:12px;font-weight:700;color:var(--muted)}
.tile b{font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile small{font-size:12px;color:var(--muted)}
.lrow{display:flex;justify-content:space-between;gap:12px;padding:11px 12px;align-items:baseline}
.lrow span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.lrow.zero{color:var(--faint)}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pnav b{font-family:var(--font-display);font-size:18px}
@media (max-width:380px){.tile b{font-size:20px}}
@media (max-width:380px){.hrow{grid-template-columns:1fr}.srow{grid-template-columns:1fr 80px 64px 32px}}

    state.appts.forEach(function(a){
      if(isBlock(a)||a.id===excludeId)return;
      var k=normKey(a.client);if(!k||k==='sin cita')return;
      var c=idx[k]||(idx[k]={key:k,name:a.client,phone:'',svc:'',visits:0,noshow:0,last:'',lastAny:''});
      if(a.date>=c.lastAny){c.lastAny=a.date;c.name=a.client;c.svc=a.service;}
      if(a.phone&&a.date>=(c.phoneDate||'')){c.phone=a.phone;c.phoneDate=a.date;}
      if(a.status==='noshow')c.noshow++;
      else if(a.date<=today){c.visits++;if(a.date>c.last)c.last=a.date;}
    });
    return idx;
  }
  function suggest(q){
    var k=normKey(q);if(k.length<2)return [];
    var idx=clientIndex(),out=[];
    Object.keys(idx).forEach(function(key){
      var c=idx[key];
      if(key.indexOf(k)===0||key.split(' ').some(function(w){return w.indexOf(k)===0;}))out.push(c);
    });
    return out.sort(function(a,b){return a.lastAny<b.lastAny?1:-1;}).slice(0,3);
  }

  function syncSettings(){

        var t=val('h-'+dow+'-'+k[0]);if(t&&/^\d\d:\d\d/.test(t))day[k[1]][k[2]]=Math.round(toMin(t.slice(0,5))/15)*15;

  function saveSettings(){
    syncSettings();
    var d=ui.draft,err='',svs=[];
    d.services.forEach(function(s){
      var nm=s.name.trim(),pr=parseFloat(String(s.price).replace(',','.'));
      if(!nm&&!String(s.price).trim())return;
      if(!nm)err=err||'Falta el nombre de un servicio.';
      else if(!(pr>=0))err=err||'Revisa el precio de «'+nm+'»: tiene que ser un número, por ejemplo 12 o 12,50.';
      svs.push({id:s.id,name:nm,dur:s.dur,price:Math.round(pr*100)/100});
    });
    if(!svs.length)err=err||'Añade al menos un servicio.';
    d.order.forEach(function(id){
      var nm=(d.names[id]||'').trim();
      if(!nm)err=err||'Falta el nombre de un barbero.';
      d.hours[id].forEach(function(day,dow){
        if(!day.open)return;
        var where=(nm||'Barbero')+', '+DAYN[dow].toLowerCase()+': ';
        if(day.a[0]>=day.a[1])err=err||where+'la hora de cierre tiene que ser después de la de apertura.';
        else if(day.split&&(day.b[0]<day.a[1]||day.b[0]>=day.b[1]))err=err||where+'el turno de tarde tiene que empezar después del de mañana y acabar más tarde.';
      });
    });
    if(err){d.err=err;render();return;}
    state.shop=d.shop.trim()||'Mi barbería';
    state.services=svs;
    var keep={};d.order.forEach(function(id){keep[id]=1;});
    state.appts=state.appts.filter(function(a){return keep[a.barber];});
    Object.keys(state.off).forEach(function(id){if(!keep[id])delete state.off[id];});
    state.barbers=d.order.map(function(id){
      return {id:id,name:d.names[id].trim(),hours:d.hours[id].map(function(day){
        if(!day.open)return [];var r=[[day.a[0],day.a[1]]];if(day.split)r.push([day.b[0],day.b[1]]);return r;
      })};
    });
    if(!barberById(ui.barber))ui.barber=state.barbers[0].id;
    if(ui.lastSvc&&!svcById(ui.lastSvc))ui.lastSvc=null;
    ui.draft=null;ui.view='agenda';
    try{location.hash='';}catch(e){}
    commit();
  }

  // ---------- Pintado ----------
  function setView(v){
    ui.view=v;ui.edit=null;ui.sheet=null;if(v!=='settings')ui.draft=null;
    if(v==='stats'&&!ui.stats)ui.stats={mode:'week',anchor:ui.date};
    try{location.hash=v==='settings'?'ajustes':v==='stats'?'resumen':'';}catch(e){}
    render();
  }
  function render(){
    persistUi();
    if(ui.view==='settings'){if(!ui.draft)openSettings();root.innerHTML=settingsHtml();return;}
    if(ui.view==='stats'){if(!ui.stats)ui.stats={mode:'week',anchor:ui.date};root.innerHTML=statsHtml();return;}
    var h=agendaHtml();
    if(ui.welcome)h+=sheetWrap(welcomeSheet(),'Cómo funciona');
    else if(ui.cal)h+=sheetWrap(calSheet(),'Calendario');
    else if(ui.sheet&&ui.sheet.type==='appt'){var inner=apptSheet();if(inner)h+=sheetWrap(inner,'Cita');}
    else if(ui.sheet&&ui.sheet.type==='walkin')h+=sheetWrap(walkinSheet(),'Cliente sin cita');
    else if(ui.sheet&&ui.sheet.type==='off')h+=sheetWrap(offSheet(),'Marcar día libre');
    root.innerHTML=h;
    if(ui.edit&&!ui.welcome&&!ui.sheet){
      var q=document.getElementById('quick');
      if(q){try{q.focus({preventScroll:false});var n=q.value.length;q.setSelectionRange(n,n);}catch(e){}}
    }
  }

  root.addEventListener('click',function(e){
    var el=e.target.closest('[data-a]');if(!el||!root.contains(el))return;
    var a=el.getAttribute('data-a'),v=el.getAttribute('data-v');
    if(a==='noop')return;
    if(ui.view==='settings'&&ui.draft){
      syncSettings();var d=ui.draft;
      if(a==='svadd'){d.services.push({id:uid('s'),name:'',dur:30,price:''});d.err='';render();var f=document.getElementById('sv-'+(d.services.length-1)+'-name');if(f)f.focus();return;}
      if(a==='svdel'){if(d.services.length>1)d.services.splice(Number(v),1);else d.err='Tiene que quedar al menos un servicio.';render();return;}
      if(a==='stbarber'){d.barber=v;d.rm=null;render();return;}
      if(a==='split'||a==='nosplit'){d.hours[d.barber][Number(v)].split=(a==='split');render();return;}
      if(a==='badd'){var id=uid('b');d.order.push(id);d.names[id]='';d.hours[id]=defHours().map(dayToDraft);d.barber=id;d.rm=null;render();var bn=document.getElementById('st-bname');if(bn)bn.focus();return;}
      if(a==='bkdown'){
        try{
          var blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'});
          var url=URL.createObjectURL(blob),dl=document.createElement('a');
          var slug=normKey(state.shop).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'barberia';
          dl.href=url;dl.download='agenda-'+slug+'-'+today+'.json';document.body.appendChild(dl);dl.click();
          setTimeout(function(){URL.revokeObjectURL(url);dl.remove();},1000);d.bkerr='';
        }catch(err){d.bkerr='No se pudo descargar la copia en este navegador.';}
        render();return;
      }
      if(a==='bkcancel'){d.restore=null;render();return;}
      if(a==='bkapply'){
        state=d.restore;normalize();ui.draft=null;ui.view='agenda';ui.edit=null;ui.sheet=null;
        if(!barberById(ui.barber))ui.barber=state.barbers[0].id;
        try{location.hash='';}catch(err){}
        commit();return;
      }
      if(a==='bdel'){
        if(d.rm!==d.barber){d.rm=d.barber;render();return;}
        var rid=d.barber;d.order=d.order.filter(function(x){return x!==rid;});delete d.names[rid];delete d.hours[rid];d.barber=d.order[0];d.rm=null;render();return;
      }
    }
    if(ui.view==='agenda'){
      if(ui.edit&&ui.edit.mode==='block'){var bq=document.getElementById('quick'),be=document.getElementById('bl-end');if(bq)ui.edit.note=bq.value;if(be)ui.edit.end=Number(be.value);}
      else syncQuick();
      syncEdit();syncOff();
      if(ui.sheet&&ui.sheet.type==='walkin'){var wn=document.getElementById('wk-name');if(wn)ui.sheet.name=wn.value;}
    }
    if(a==='smode'){ui.stats.mode=v;render();return;}
    if(a==='sshift'){var sd=parseDate(ui.stats.anchor);if(ui.stats.mode==='week')ui.stats.anchor=addDays(ui.stats.anchor,7*Number(v));else ui.stats.anchor=ymd(new Date(sd.getFullYear(),sd.getMonth()+Number(v),1));render();return;}
    if(a==='qpick'){var qc=clientIndex()[v];if(qc&&ui.edit){ui.edit.name=qc.name;ui.edit.phone=qc.phone;ui.edit.picked=true;var qs=svcIdByName(qc.svc);if(qs)ui.edit.svc=qs;ui.edit.err='';}render();return;}
    if(a==='qblock'){ui.edit.mode='block';ui.edit.note='';ui.edit.end=0;ui.edit.err='';render();return;}
    if(a==='qappt'){ui.edit.mode='appt';ui.edit.err='';render();return;}
    if(a==='walkin'){ui.edit=null;openWalkin();render();var wf=document.getElementById('wk-name');if(wf)wf.focus();return;}
    if(a==='wksvc'){ui.sheet.svc=v;render();return;}
    if(a==='wkb'){ui.sheet.barber=v;render();return;}
    if(a==='wkpick'){var wc=clientIndex()[v];if(wc){ui.sheet.name=wc.name;ui.sheet.phone=wc.phone;ui.sheet.picked=true;var ws=svcIdByName(wc.svc);if(ws)ui.sheet.svc=ws;}render();return;}
    if(a==='dayoff'){ui.edit=null;ui.sheet={type:'off',reason:'',days:1,all:false};render();return;}
    if(a==='dayon'){if(state.off[ui.barber])delete state.off[ui.barber][ui.date];commit();return;}
    if(a==='unblock'){var ub=ui.sheet.id;state.appts=state.appts.filter(function(x){return x.id!==ub;});ui.sheet=null;commit();return;}
    if(a==='wa'){var wid=ui.sheet&&ui.sheet.id;setTimeout(function(){var wa=state.appts.filter(function(x){return x.id===wid;})[0];if(wa&&!wa.reminded){wa.reminded=true;commit();}},400);return;}
    if(a==='view'){setView(v);return;}
    if(a==='cal'){ui.edit=null;ui.sheet=null;openCal();render();return;}
    if(a==='calm'){var nm=ui.cal.m+Number(v);ui.cal={y:ui.cal.y+Math.floor(nm/12),m:((nm%12)+12)%12};render();return;}
    if(a==='calpick'){ui.date=v;ui.cal=null;ui.edit=null;render();return;}
    if(a==='close'){if(el.classList.contains('scrim')&&e.target!==el)return;ui.sheet=null;ui.cal=null;if(ui.welcome){closeWelcome();return;}render();return;}
    if(a==='help'){ui.sheet=null;ui.edit=null;ui.welcome=true;render();return;}
    if(a==='wclose'){closeWelcome();return;}
    if(a==='shift'){ui.date=addDays(ui.date,Number(v));ui.edit=null;render();return;}
    if(a==='today'){ui.date=today;ui.edit=null;render();return;}
    if(a==='tab'){ui.barber=v;ui.edit=null;render();return;}
    if(a==='free'){startEdit(Number(v));render();return;}
    if(a==='qsvc'){ui.edit.svc=v;ui.edit.err='';render();return;}
    if(a==='qcancel'){ui.edit=null;render();return;}
    if(a==='appt'){ui.edit=null;openAppt(v);render();return;}
    if(a==='esvc'){ui.sheet.svc=v;ui.sheet.err='';render();return;}
    if(a==='status'){
      var ap=state.appts.filter(function(x){return x.id===ui.sheet.id;})[0];
      if(ap)ap.status=(ap.status===v?'pend':v);
      ui.sheet=null;commit();return;
    }
    if(a==='del'){
      if(!ui.sheet.confirmDel){ui.sheet.confirmDel=true;render();return;}
      var did=ui.sheet.id;state.appts=state.appts.filter(function(x){return x.id!==did;});ui.sheet=null;commit();return;
    }
  });
  root.addEventListener('submit',function(e){
    e.preventDefault();
    var f=e.target.getAttribute('data-f');
    if(f==='quick')saveQuick();
    else if(f==='block')saveBlock();
    else if(f==='walkin')saveWalkin();
    else if(f==='off')saveOff();
    else if(f==='edit')saveEdit();
    else if(f==='settings')saveSettings();
  });
  root.addEventListener('change',function(e){
    var t=e.target;if(!t||!t.id)return;
    if(ui.view==='settings'&&ui.draft&&t.getAttribute('data-chg')){syncSettings();render();return;}
    if(ui.sheet&&ui.sheet.type==='off'&&t.getAttribute('data-chg')){syncOff();render();}
  });
  root.addEventListener('change',function(e){
    var t=e.target;if(!t||t.id!=='bk-file'||!ui.draft)return;
    var f=t.files&&t.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      syncSettings();
      try{
        var data=JSON.parse(rd.result);
        if(!data||!Array.isArray(data.barbers)||!data.barbers.length||!Array.isArray(data.services)||!Array.isArray(data.appts))throw new Error('formato');
        ui.draft.restore=data;ui.draft.bkerr='';
      }catch(err){ui.draft.restore=null;ui.draft.bkerr='Ese archivo no es una copia de esta agenda. Elige el archivo que descargaste con «Descargar copia».';}
      render();
    };
    rd.onerror=function(){ui.draft.bkerr='No se pudo leer el archivo.';render();};
    rd.readAsText(f);
  });
  root.addEventListener('input',function(e){
    var t=e.target;if(!t||!t.id)return;
    if(t.id==='quick'&&ui.edit&&ui.edit.mode!=='block'){
      ui.edit.name=t.value;ui.edit.picked=false;ui.edit.phone='';
      var box=document.getElementById('sugg-quick');if(box)box.innerHTML=suggHtml(t.value,'qpick');
    }else if(t.id==='wk-name'&&ui.sheet&&ui.sheet.type==='walkin'){
      ui.sheet.name=t.value;ui.sheet.picked=false;ui.sheet.phone='';
      var wb=document.getElementById('sugg-wk');if(wb)wb.innerHTML=suggHtml(t.value,'wkpick');
    }
  });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    if(ui.view!=='agenda')return;
    if(ui.welcome){closeWelcome();return;}
    if(ui.cal){ui.cal=null;render();return;}
    if(ui.sheet){ui.sheet=null;render();return;}
    if(ui.edit){ui.edit=null;render();}
  });
  window.addEventListener('hashchange',function(){
    var v=location.hash==='#ajustes'?'settings':location.hash==='#resumen'?'stats':'agenda';
    if(v!==ui.view){ui.view=v;ui.edit=null;ui.sheet=null;if(v!=='settings')ui.draft=null;render();}
  });
  render();
})();
</script></body></html>
